# Weekly dependency updates. Without this nobody is told when a dependency the
# system already uses turns out to be vulnerable — which is how python-jose and
# zod advisories went unnoticed until an audit was run by hand.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Vientiane
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Vientiane
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
