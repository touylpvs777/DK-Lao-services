version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: dk-backend
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=false
      - ENVIRONMENT=production
      - PORT=8001
    ports:
      # Local only: the public reaches the API through the HTTPS reverse proxy, never this port directly.
      - "127.0.0.1:8001:8001"
    volumes:
      # Uploaded product images survive a rebuild.
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: dk-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: dk-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Use a non-conflicting local host port because another Postgres service is
      # already bound to 5432 on this machine.
      - "127.0.0.1:${DB_PORT}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional HTTPS entry without opening any router port: `docker compose --profile tunnel up -d`.
  # In the Cloudflare Zero Trust dashboard, point the tunnel's public hostname at http://frontend:80.
  cloudflared:
    image: cloudflare/cloudflared:2025.9.0
    container_name: dk-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
    profiles: ["tunnel"]
    restart: unless-stopped

  # Temporary HTTPS address with no Cloudflare account setup or domain: `docker compose --profile quicktunnel up -d`.
  # The address (https://<random>.trycloudflare.com) is printed in `docker logs dk-quicktunnel` and changes
  # every time this container restarts, so the website's CRM_API_URL must be updated with it. Testing only.
  quicktunnel:
    image: cloudflare/cloudflared:2025.9.0
    container_name: dk-quicktunnel
    command: tunnel --no-autoupdate --url http://backend:8001
    depends_on:
      - backend
    profiles: ["quicktunnel"]
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
