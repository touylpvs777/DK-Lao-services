name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  frontend-checks:
    name: Frontend lint, type check, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Reporting only: the codebase starts with 49 ESLint errors and 28
      # warnings, mostly react-hooks/exhaustive-deps and the React Compiler's
      # incompatible-library notice on React Hook Form's watch(). Work that
      # number down, then delete continue-on-error so new breakage fails here.
      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reporting only for now: the repository starts with a backlog of known
    # advisories (python-jose/ecdsa on the backend, and a set on the frontend),
    # and some have no fixed release yet. Read the job summary on every run and
    # work the backlog down; once it is empty, delete the two
    # `continue-on-error` lines below so a new advisory fails the build.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Python dependencies
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit npm dependencies
        continue-on-error: true
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high
